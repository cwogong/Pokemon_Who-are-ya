<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬스터 Who are ya?</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; background-color: #f0f0f0; }
        h1 { color: #ffcb05; text-shadow: 2px 2px 4px #3b4cca; margin-bottom: 10px; }
        .game-container { max-width: 950px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        .mystery-container {
            width: 120px; height: 120px; margin: 0 auto 20px; background-color: #e0e0e0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 60px; font-weight: bold;
            color: #787c7e; box-shadow: 0 4px 8px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #3b4cca;
        }
        #mysteryImage { width: 100%; height: 100%; object-fit: contain; background-color: white; }

        .input-area { margin-bottom: 20px; display: flex; justify-content: center; align-items: flex-start; gap: 5px; }
        
        /* 커스텀 자동완성 컨테이너 */
        .autocomplete-container { position: relative; display: inline-block; }
        input[type="text"] { padding: 10px; width: 200px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .autocomplete-items {
            position: absolute; border: 1px solid #d4d4d4; border-top: none; z-index: 99;
            top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; 
            background-color: white; border-radius: 0 0 5px 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: left;
        }
        .autocomplete-items div {
            padding: 10px; cursor: pointer; border-bottom: 1px solid #d4d4d4; font-size: 14px; color: #333;
        }
        .autocomplete-items div:hover { background-color: #e9e9e9; }
        
        /* 버튼 공통 스타일 및 개별 색상 */
        button { padding: 10px 20px; height: 40.5px; font-size: 16px; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-submit { background-color: #3b4cca; }
        .btn-submit:hover { background-color: #2a3b96; }
        
        .btn-giveup { background-color: #607d8b; }
        .btn-giveup:hover { background-color: #455a64; }

        .btn-restart { background-color: #f44336; }
        .btn-restart:hover { background-color: #d32f2f; }
        
        .grid-header, .grid-row { display: grid; grid-template-columns: 1.2fr 1.2fr 1.8fr 0.8fr 1fr 1fr 1fr; gap: 5px; }
        .grid-header { font-weight: bold; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #ccc; }
        .grid-row { margin-bottom: 5px; }
        
        .grid-cell { 
            padding: 15px 5px; border-radius: 5px; font-size: 14px; font-weight: bold; color: white; 
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        
        .img-cell { padding: 5px; }
        .img-cell img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.4)); }

        .type-container { padding: 0; background-color: transparent !important; gap: 5px; align-items: stretch; }
        .type-badge { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
        
        .correct { background-color: #6aaa64; } 
        .incorrect { background-color: #787c7e; } 
        
        .arrow-up { color: #ff5252; font-weight: 900; font-size: 18px; margin-left: 4px; }
        .arrow-down { color: #448aff; font-weight: 900; font-size: 18px; margin-left: 4px; }

        #message { margin-top: 20px; font-weight: bold; font-size: 18px; color: #d32f2f; line-height: 1.5; }
        .rank-text { font-size: 24px; color: #3b4cca; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>포켓몬 Who are ya?</h1>
    
    <div class="mystery-container">
        <div id="mysteryQuestion">?</div>
        <img id="mysteryImage" src="" alt="정답 포켓몬" style="display: none;">
    </div>

    <div class="input-area">
        <div class="autocomplete-container">
            <input type="text" id="guessInput" placeholder="포켓몬 이름 입력..." autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-items"></div>
        </div>
        <button onclick="makeGuess()" class="btn-submit">도전!</button>
        <!-- 포기하기 버튼 추가 -->
        <button onclick="giveUp()" class="btn-giveup">🏳️ 포기하기</button>
        <button onclick="restartGame()" class="btn-restart">🔄 다시 하기</button>
    </div>
    
    <div id="gameBoard">
        <div class="grid-header">
            <div>사진</div>
            <div>이름</div>
            <div>타입</div>
            <div>세대</div>
            <div>진화단계</div>
            <div>키(m)</div>
            <div>몸무게(kg)</div>
        </div>
    </div>
    
    <div id="message"></div>
</div>

<script src="database.js"></script>
<script src="logic.js"></script>

</body>
</html>
